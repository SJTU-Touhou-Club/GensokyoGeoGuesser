server {
    listen 80;
    listen [::]:80;
    server_name ggg-neo.arthas.org;

    # Certbot HTTP-01 challenge path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Main reverse proxy to Flask app.
    location / {
        proxy_pass http://127.0.0.1:20811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_buffering off;
    }

    # Explicit SSE handling for game and lobby event streams.
    location ^~ /events/ {
        proxy_pass http://127.0.0.1:20811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_buffering off;

        # Recommended for streaming responses.
        add_header X-Accel-Buffering no;
    }
}

