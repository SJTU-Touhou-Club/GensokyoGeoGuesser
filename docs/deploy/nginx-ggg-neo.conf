server {
    listen 80;
    listen [::]:80;
    server_name ggg-neo.arthas.org;

    # Certbot HTTP-01 challenge path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Enable HTTP/2 on the TLS listener (nginx 1.24: listen 443 ssl http2).
    # Large media bypass Python; keep each filename's contents stable for this TTL.
    location /media/ {
        alias /home/priv/apps/GensokyoGeoGuesser/static/media/;
        add_header Cache-Control "public, max-age=86400";
    }
    location /dataset/ {
        alias /home/priv/apps/GensokyoGeoGuesser/static/dataset/;
        add_header Cache-Control "public, max-age=86400";
    }
    location /assets/ {
        alias /home/priv/apps/GensokyoGeoGuesser/static/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main reverse proxy to Flask app.
    location / {
        proxy_pass http://127.0.0.1:20811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_buffering off;
    }

    # Explicit SSE handling for game and lobby event streams.
    location ^~ /events/ {
        proxy_pass http://127.0.0.1:20811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
        proxy_buffering off;

        # Recommended for streaming responses.
        add_header X-Accel-Buffering no;
    }
}

