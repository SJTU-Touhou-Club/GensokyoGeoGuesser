players:
  min: 2
  max: 8

lobby:
  countdown_seconds: 10
  heartbeat_seconds: 5

rounds:
  max_rounds: 16
  max_hp: 100.0

data_files:
  locations: locations_v2.csv
  questions: questions_v2.csv

timeouts:
  place_guess: 30
  agree_next: 10

