#   tie_threshold: 0.1

scoring:
  mode: points
  scoring_fn: ranking
  distance_scale: 1
  rank_tolerance: 0.05
  tie_threshold: 0.1

dmg_mult_schedule:
  - { rounds: 10, mult: 1.0 }
  - { rounds: 4, mult: 1.5 }
  - { rounds: 999, mult: 2.0 }

pin_colors:
  - "#5557EE"
  - "#EE5755"
  - "#57EE55"
  - "#EEAA55"
  - "#AA55EE"
  - "#55EEAA"
  - "#EE55AA"
  - "#55AAEE"
  - "#EEEE55"
  - "#EE5555"

debug:
  enabled: false
